[package]
name = "winterminalp"
version = "0.2.0"
description = "A tmux-style input controller for native Windows Terminal panes"
authors = ["raincfhnj"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/raincfhnj/winterminalp"
homepage = "https://github.com/raincfhnj/winterminalp"
readme = "README.md"
keywords = ["windows-terminal", "tmux", "keyboard", "shortcuts", "windows"]
categories = ["command-line-utilities", "os::windows-apis"]
edition = "2024"
rust-version = "1.85"
default-run = "winter"

[lib]
name = "winterminalp"

[[bin]]
name = "winterminalp"
path = "src/bin/winterminalp.rs"

[[bin]]
name = "winter"
path = "src/bin/winter.rs"

[[bin]]
name = "winterd"
path = "src/bin/winterd.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1"
tempfile = "3"

# Faster local iteration: dependencies carry no debug info, and this crate
# keeps only line tables, so linking tests/bins is significantly cheaper
# while backtraces still resolve to source lines.
[profile.dev.package."*"]
debug = false

[profile.dev]
debug = "line-tables-only"

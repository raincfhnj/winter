name: Bug report
description: Report a reproducible problem with Winter
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail
        as you can. For security issues, use the private advisory flow below instead of
        this form.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I ran `winter doctor` and included its output below.
          required: false
  - type: input
    id: version
    attributes:
      label: Winter version
      description: Output of `winter --version` or the release you installed.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2 (build 22631)"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Windows Terminal version and channel
      placeholder: "Stable 1.24.11911.0"
    validations:
      required: true
  - type: dropdown
    id: elevated
    attributes:
      label: Was Windows Terminal running elevated?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `winter install`
        2. Press Ctrl+B ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `winter doctor`
      description: Paste the JSON report. Remove anything you consider sensitive.
      render: json
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: Error log from `%LOCALAPPDATA%\Winter\last-error.log` if present, screenshots, or notes.
    validations:
      required: false
